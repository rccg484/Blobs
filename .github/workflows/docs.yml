name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen and Graphviz
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Fetch doxygen-awesome-css
        run: |
          git clone --depth=1 https://github.com/jothepro/doxygen-awesome-css.git /tmp/doxygen-awesome
          cp /tmp/doxygen-awesome/doxygen-awesome.css .
          cp /tmp/doxygen-awesome/doxygen-awesome-sidebar-only.css .

      - name: Generate docs
        run: |
          sed -i "s|^STRIP_FROM_PATH.*|STRIP_FROM_PATH = ${{ github.workspace }}|" Doxyfile
          grep -n "^STRIP_FROM_PATH" Doxyfile
          doxygen Doxyfile

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/html'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4